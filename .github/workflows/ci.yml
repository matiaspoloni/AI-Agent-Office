name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, bindings (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npm run lint
      - run: npm run test
      - run: node --test scripts/update-manifest.test.mjs
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- src/bindings
      - run: node scripts/smoke.mjs

  windows:
    name: Windows build, tests and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace
      - run: npx vitest run
      - name: Windows smoke test (headless)
        run: node scripts/smoke.mjs
      - name: Stamp the published build number
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ai-agent-office-architecture-y8wggg')
        env:
          AGENT_OFFICE_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - name: Build installer (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build
      - name: Installer smoke test (install, run, uninstall on this clean VM)
        run: node scripts/installer-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AgentOfficeSetup
          path: dist-installer/
          if-no-files-found: error

  macos:
    name: macOS build, tests and disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace --no-fail-fast
      - run: npx vitest run
      - name: macOS smoke test (headless)
        run: node scripts/smoke.mjs
      - name: Stamp the published build number
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ai-agent-office-architecture-y8wggg')
        env:
          AGENT_OFFICE_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/stamp-build-version.mjs
      - name: Build the app and disk image (universal, ad hoc signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build
      - name: Disk image smoke test (mount, check, install, run, hooks, open)
        run: node scripts/dmg-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AgentOffice-macOS
          path: dist-installer/
          if-no-files-found: error

  # Installers plus, when both platforms of this build exist, latest.json.
  # The installed app reads that file and asks before replacing itself.
  publish:
    name: Publish installers
    needs: [checks, windows, macos]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ai-agent-office-architecture-y8wggg' || startsWith(github.ref, 'refs/tags/v')) &&
      !cancelled() &&
      needs.checks.result == 'success' &&
      (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect the installers that passed their smoke test
        run: |
          mkdir -p out
          if [ -d dist/AgentOffice-macOS ]; then cp -R dist/AgentOffice-macOS/. out/; fi
          if [ -d dist/AgentOfficeSetup ]; then cp -R dist/AgentOfficeSetup/. out/; fi
          ls -lh out
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh out
