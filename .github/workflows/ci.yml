name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, bindings (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npm run lint
      - run: npm run test
      - name: Generated TypeScript bindings are up to date
        run: git diff --exit-code -- src/bindings
      - run: node scripts/smoke.mjs

  windows:
    name: Windows build, tests and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: cargo test --workspace
      - run: npx vitest run
      - name: Windows smoke test (headless)
        run: node scripts/smoke.mjs
      - name: Build installer (NSIS)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AgentOfficeSetup
          path: dist-installer/AgentOfficeSetup.exe
          if-no-files-found: error
