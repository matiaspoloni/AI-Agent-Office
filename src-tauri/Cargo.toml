[package]
name = "agent-office"
description = "Agent Office desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "agent-office"

[lib]
name = "agent_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ao-core.workspace = true
ao-store.workspace = true
ao-detect.workspace = true
ao-hook-relay.workspace = true
ao-ipc = { workspace = true, features = ["server"] }
ao-process.workspace = true
ao-provider-claude.workspace = true
ao-provider-codex.workspace = true
ao-provider-cursor.workspace = true
ao-provider-demo.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
ao-testkit.workspace = true
