[package]
name = "ao-hook-relay"
description = "Fail-open hook relay: forwards an agent CLI hook payload to the running Agent Office app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agent-office-hook"
path = "src/main.rs"

[dependencies]
ao-ipc.workspace = true
serde_json.workspace = true

[dev-dependencies]
ao-ipc = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
