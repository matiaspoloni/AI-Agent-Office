[package]
name = "ao-process"
description = "Process manager: spawn agents with piped stdio, own their whole process tree, never touch foreign processes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ao-core.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
ao-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
