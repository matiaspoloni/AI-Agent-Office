[package]
name = "ao-provider-demo"
description = "Agent Office demo provider: clearly labelled simulated sessions for UI development and tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ao-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Only used by the preview recorder example to embed provider descriptors.
ao-provider-claude.workspace = true
ao-provider-codex.workspace = true
ao-provider-cursor.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
