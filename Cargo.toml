[workspace]
resolver = "2"
members = [
  "crates/ao-config",
  "crates/ao-core",
  "crates/ao-store",
  "crates/ao-detect",
  "crates/ao-hook-relay",
  "crates/ao-ipc",
  "crates/ao-jsonrpc",
  "crates/ao-process",
  "crates/ao-testkit",
  "crates/providers/ao-provider-claude",
  "crates/providers/ao-provider-codex",
  "crates/providers/ao-provider-cursor",
  "crates/providers/ao-provider-demo",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
ao-config = { path = "crates/ao-config" }
ao-core = { path = "crates/ao-core" }
ao-store = { path = "crates/ao-store" }
ao-detect = { path = "crates/ao-detect" }
ao-testkit = { path = "crates/ao-testkit" }
ao-process = { path = "crates/ao-process" }
ao-ipc = { path = "crates/ao-ipc" }
ao-jsonrpc = { path = "crates/ao-jsonrpc" }
ao-hook-relay = { path = "crates/ao-hook-relay" }
ao-provider-claude = { path = "crates/providers/ao-provider-claude" }
ao-provider-codex = { path = "crates/providers/ao-provider-codex" }
ao-provider-cursor = { path = "crates/providers/ao-provider-cursor" }
ao-provider-demo = { path = "crates/providers/ao-provider-demo" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
which = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
